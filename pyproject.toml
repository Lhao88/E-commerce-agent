[project]
name = "ecommerce-agent-backend"
version = "0.1.0"
description = "Backend MVP for digital product shopping guide agent."
requires-python = ">=3.9"
dependencies = [
  "alembic>=1.13,<2.0",
  "fastapi>=0.110,<1.0",
  "greenlet>=3.1,<3.2",
  "pydantic>=2.6,<3.0",
  "pydantic-settings>=2.2,<3.0",
  "psycopg[binary]>=3.2,<4.0",
  "redis>=5.0,<6.0",
  "sqlalchemy>=2.0,<3.0",
  "uvicorn[standard]>=0.27,<1.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.26,<1.0",
  "pytest>=8.0,<9.0",
]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]

[tool.setuptools.packages.find]
where = ["backend"]
include = ["app*"]
